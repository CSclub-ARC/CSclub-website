<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARC Computer Science Club </title>
    <link href="style.css" rel="stylesheet">
    <script src="https://kit.fontawesome.com/15da3f5c5b.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <main>
    <h1 class="header"> ARC Computer Science Club</h1>
    <section class="info">
      <p>Wednesdays @ 4:30-5:30 PM, STEM 307 <a href="https://discord.gg/B74Ts3rUxy" class="fa-brands fa-discord"> </a></p>
    </section>
    <section class="terminal" id="terminal">
    <div class="terminal__header">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="terminal__title">arc-csclub — terminal</span>
    </div>

    <div class="terminal__screen" id="screen" aria-live="polite"></div>

    <form class="terminal__inputRow" id="terminalForm" autocomplete="off">
      <span class="terminal__prompt">arc@csclub:~$</span>
      <input
        id="terminalInput"
        class="terminal__input"
        type="text"
        spellcheck="false"
        autocapitalize="off"
        autocomplete="off"
        placeholder="type 'help' and press Enter..."
      />
    </form>
  </section>
    <nav class="social"></nav>
      </nav>
    </main>
      <script src="main.js"></script>
  </body>
</html>
